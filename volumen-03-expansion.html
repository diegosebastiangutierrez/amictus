<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ✏️ PLANTILLA SERIE (volumen): duplicar por serie y cambiar ACTIVA (1–6).
     Nombrado sugerido: serie-1.html … serie-6.html · y las copias de plantilla-libro.html como libro-<slug>.html -->
<title>EXPANSION · VOLÚMEN III · AMICTUS</title>
<meta name="description" content="CODEX, la serie enciclopédica de AMICTUS: siete libros sobre calzado, marroquinería, prendas, accesorios, textiles y joyería.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="amictus.css">
<link rel="stylesheet" href="volumen.css">

</head>

<script src="amictus.js"></script>

<body>

<!-- ============ HERO (todo se renderiza desde SERIES[ACTIVA]) ============ -->
<section class="hero-serie">
  <div class="contenedor">
    <p class="etiqueta" id="etq"></p>
    <h1 id="h1"></h1>
    <p class="tagline" id="tagline"></p>
    <p class="desc" id="desc"></p>
    <div class="chips" id="chips"></div>
    <div class="cta-row">
      <a href="#libros" class="btn btn--oro">Ver los libros</a>
      <a href="#bundle" class="btn btn--linea">Bundle de la serie</a>
    </div>
  </div>
</section>

<div class="marquee" aria-hidden="true">
  <div class="marquee-track" id="marqueeTrack"></div>
</div>

<!-- ============ LIBROS DE LA SERIE (linkeados a libro-<slug>.html) ============ -->
<section class="libros-sec" id="libros">
  <div class="contenedor">
    <p class="etiqueta">Los libros de esta serie</p>
    <div class="seccion-head"><h2 id="h2libros"></h2></div>
    <div class="estanteria" id="librosGrid"></div>
    <div class="cifras" id="cifras"></div>
  </div>
</section>

<!-- ============ CARÁCTER (banda blanca) ============ -->
<section class="caracter">
  <div class="contenedor caracter-grid">
    <div>
      <p class="etiqueta etiqueta--azul">El carácter de la serie</p>
      <div class="seccion-head"><h2 id="h2car"></h2></div>
      <p id="descCar"></p>
    </div>
    <ul class="ejes" id="ejes"></ul>
  </div>
</section>

<!-- ============ BUNDLE (banda azul) ============ -->
<section class="bundle" id="bundle">
  <div class="contenedor">
    <p class="etiqueta etiqueta--clara">Bundle · precio de serie</p>
    <h2 id="h2bundle"></h2>
    <p class="bajada" id="descBundle"></p>
    <div class="cta-row">
      <a href="#" class="btn btn--oro">Bundle · US$24.99</a>
      <a href="index.html#cura" class="btn btn--linea">CURA gratis</a>
    </div>
  </div>
</section>

<!-- ============ PREV / SIGUIENTE ============ -->
<nav class="pie-serie">
  <div class="contenedor">
    <div class="pie-link" id="pieAnt"></div>
    <div class="pie-link pie-link--sig" id="pieSig"></div>
  </div>
</nav>

<script>
/* ✏️ ACTIVA: 1=CODEX 2=PRAXIS 3=EXPANSION 4=MUNDUS 5=MERCATUS 6=OPUS.
   Duplicá este archivo como serie-1.html … serie-6.html y cambiá el número. */
const ACTIVA = 3;
const ROM = ['I','II','III','IV','V','VI'];
const TAGS = {imprenta:'En imprenta', listo:'Listo', gratis:'Gratis', pronto:'En escritura'};
const PIELES = ['tapa--negro','tapa--azul','tapa--vivo'];

const SERIES = {
 1:{nom:'CODEX',split:['Co','dex'],tag:'La enciclopedia de lo que vistes.',
	 folder:'codex',
    desc:'Siete libros-monografía que documentan cada territorio del vestir: calzado, marroquinería, prendas femeninas y masculinas, accesorios, textiles y joyería.',
    car:'Documentar como se documenta una especie: cada libro CODEX aplica el método AMICTUS —historia, anatomía, monografías, cuidado y compra— a un territorio completo de la indumentaria. Leídos juntos, componen la enciclopedia.',
    ejes:['Historia','Anatomía','Monografías','Cuidado','Compra'],
    libros:[['CALCEUS','Calzado',40,'imprenta'],['CORIUM','Marroquinería',22,'listo'],['STOLA','Prendas femeninas',24,'listo'],['TOGA','Prendas masculinas',24,'listo'],['CULTUS','Accesorios',22,'listo'],['TEXTUM','Textiles',24,'listo'],['AURUM','Joyería y relojería',24,'listo']]},
 2:{nom:'PRAXIS',split:['Pra','xis'],tag:'El saber hacer, paso a paso.',
    folder:'praxis',
    desc:'Seis guías prácticas: estilo masculino, colorimetría, protocolo, patronaje, historia transversal y teoría del color.',
    car:'PRAXIS es la serie de aplicación: toma el conocimiento de CODEX y lo convierte en método diario — decidir, combinar, ajustar y cuidar con criterio propio.',
    ejes:['Método','Códigos','Fit','Práctica','Herramientas'],
    libros:[['SARTOR','Estilo masculino',17,'listo'],['VENUSTA','Colorimetría y cuerpo',20,'listo'],['DECORUM','Protocolo y etiqueta',20,'listo'],['FORMA','Patronaje y sastrería',20,'listo'],['MODUS','Historia transversal',22,'listo'],['COLOR','Teoría del color',20,'listo']]},
 3:{nom:'EXPANSION',split:['Expan','sion'],tag:'Categorías que crecen contigo.',
    folder:'expansion',
    desc:'Seis categorías profundas: cuidado, outerwear, lencería, denim, sportswear y perfume. Incluye CURA, el manual gratuito.',
    car:'EXPANSION abre el armario por cajones: cada libro agota una categoría completa, con su historia, sus materiales y su guía de compra. CURA —el lead magnet— es la puerta de entrada.',
    ejes:['Categorías','Cuidado','Códigos','Compra'],
    libros:[['CURA','Cuidado · lead magnet',18,'gratis'],['PALLIUM','Abrigos y outerwear',20,'listo'],['INTIMA','Lencería',17,'listo'],['INDICUM','Denim',20,'listo'],['ATHLETA','Sportswear y athleisure',20,'listo'],['ESSENTIA','Perfume',20,'listo']]},
 4:{nom:'MUNDUS',split:['Mun','dus'],tag:'La moda del mundo, región por región.',
    folder:'mundus',
    desc:'Seis geografías del vestir: Asia, África, América, mundo islámico, Oceanía y nórdicos. ASIA ya está escrito.',
    car:'MUNDUS descentra la mirada: cada volumen lee una región como un sistema propio de prendas, rituales y códigos — sin jerarquías occidentales.',
    ejes:['Regiones','Historia local','Códigos','Contemporáneo'],
    libros:[['ASIA','Moda asiática',25,'listo'],['AFRICA','Moda africana',null,'pronto'],['AMERICA','Moda americana',null,'pronto'],['ISLAM','Moda islámica',null,'pronto'],['OCEANIA','Moda de Oceanía',null,'pronto'],['BOREALIS','Moda nórdica',null,'pronto']]},
 5:{nom:'MERCATUS',split:['Mer','catus'],tag:'El negocio detrás de la prenda.',
    folder:'mercatus',
    desc:'Cuatro volúmenes de industria: inversión, cadena de suministro, comercio y moda digital.',
    car:'MERCATUS lee la moda como lo que también es: una cadena de valor. Para quienes quieren entender —o trabajar— el negocio detrás de la etiqueta.',
    ejes:['Inversión','Supply','Retail','Digital'],
    libros:[['INVEST','Inversión en moda',null,'pronto'],['SUPPLY','Cadena de suministro',null,'pronto'],['MERCATOR','Comercio y retail',null,'pronto'],['DIGITALIS','Moda digital',null,'pronto']]},
 6:{nom:'OPUS',split:['O','pus'],tag:'Las manos que hacen la moda.',
    folder:'opus',
    desc:'Tres libros de oficio: artesanos, herramientas y técnicas detrás de cada prenda.',
    car:'OPUS cierra el círculo: el homenaje a los oficios — las manos, las herramientas y las técnicas sin las que ninguna de las otras series existiría.',
    ejes:['Artesanos','Herramientas','Técnicas'],
    libros:[['ARTIFEX','Los oficios',null,'pronto'],['ORGANA','Herramientas',null,'pronto'],['TECHNICA','Técnicas',null,'pronto']]}
};

const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const S = SERIES[ACTIVA];
const caps = S.libros.reduce((a,l)=>a+(l[2]||0),0);
const listos = S.libros.filter(l=>l[3]==='listo'||l[3]==='imprenta'||l[3]==='gratis').length;

/* Hero */
document.getElementById('etq').textContent = `VOLÚMEN ${ROM[ACTIVA-1]} · ${S.nom} · ${S.libros.length} libros`;
document.getElementById('h1').innerHTML = `${S.split[0]}<span>${S.split[1]}</span>`;
document.getElementById('tagline').textContent = S.tag;
document.getElementById('desc').textContent = S.desc;
document.getElementById('chips').innerHTML =
  `<span class="chip chip--oro">${S.libros.length} libros</span>`+
  `<span class="chip">${caps} capítulos escritos</span>`+
  `<span class="chip">ES · EN · IT · FR</span>`+
  `<span class="chip">${listos} listos · ${S.libros.length-listos} en escritura</span>`;

/* Marquee con los nombres de los libros */
const grupo = `<div class="marquee-grupo">${S.libros.map(l=>`<span>${l[0]}</span>`).join('')}</div>`;
document.getElementById('marqueeTrack').innerHTML = grupo + grupo;

/* Grilla de libros linkeados */
document.getElementById('h2libros').innerHTML = `Los ${S.libros.length} libros de <em>${S.nom}.</em>`;
document.getElementById('librosGrid').innerHTML = S.libros.map((l,i)=>{
  const href = l[3]==='pronto' ? '#' : `${S.folder}/libro-${slug(l[0])}.html`;
  return `
  <a href="${href}" alt="Amictus · ${S.nom}" title="Amictus · ${S.nom}">
		<article class="libro ${l[3]==='pronto'?'libro--pronto':PIELES[i%3]}" style="background-image:url(img/tapas/${l[0].toLowerCase()}.jpg)">
		  <div class="libro-top"><span>Amictus · ${S.nom}</span><span>${ROM[ACTIVA-1]}·${String(i+1).padStart(2,'1')}</span></div>
			<div class="theme-container">
				<div class="libro-filete"></div>
				<h3 class="libro-titulo">${l[0]}</h3>
				<p class="tapa-tema">${l[1]}</p>
			</div>
			<div class="libro-pie">
				<span>${l[2]?l[2]+' capítulos':'Próximamente'}</span>
				<em class="tag">${TAGS[l[3]]}</em>
			</div>
		</article>
		<span class="libro-cta">${l[3]==='pronto'?'En escritura':'Ver libro →'}</span>
    </a>`;
}).join('');

/* Cifras */
document.getElementById('cifras').innerHTML = `
  <div class="cifra"><strong>${String(S.libros.length).padStart(2,'0')}</strong><span>Libros</span></div>
  <div class="cifra"><strong>${caps||'—'}</strong><span>Capítulos escritos</span></div>
  <div class="cifra"><strong>04</strong><span>Idiomas</span></div>
  <div class="cifra"><strong>${ROM[ACTIVA-1]}</strong><span>Serie de VI</span></div>`;

/* Carácter */
document.getElementById('h2car').innerHTML = `${S.nom} es <em>un modo de leer.</em>`;
document.getElementById('descCar').textContent = S.car;
document.getElementById('ejes').innerHTML = S.ejes.map(e=>`<li><strong>${e}</strong></li>`).join('');

/* Bundle */
document.getElementById('h2bundle').textContent = `La serie ${S.nom} completa, en un solo gesto.`;
document.getElementById('descBundle').textContent = `Los ${S.libros.length} libros de ${S.nom} juntos, con descuento de serie y acceso anticipado a los volúmenes en escritura.`;

/* Prev / siguiente */
const ant = ACTIVA===1?6:ACTIVA-1, sig = ACTIVA===6?1:ACTIVA+1;
document.getElementById('pieAnt').innerHTML = `<small>← VOLÚMEN ${ROM[ant-1]}</small><a href="volumen-${String(ant).padStart(2,0)}-${SERIES[ant].nom.toLowerCase()}.html">${SERIES[ant].nom}</a>`;
document.getElementById('pieSig').innerHTML = `<small>VOLÚMEN ${ROM[sig-1]} →</small><a href="volumen-${String(sig).padStart(2,0)}-${SERIES[sig].nom.toLowerCase()}.html">${SERIES[sig].nom}</a>`;
document.getElementById('pieMarca').textContent = `Serie ${ROM[ACTIVA-1]} · ${S.nom}`;
</script>

</body>
</html>
